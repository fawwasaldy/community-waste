services:
  app:
    image: ${IMAGE_NAME}:latest
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: mongodb
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?replicaSet=rs0&authSource=admin"
      MONGODB_DATABASE: ${MONGODB_DATABASE}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mongodb:
    image: mongo:8
    command: mongod --replSet rs0 --bind_ip_all --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:8
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: >
      mongosh --host mongodb
      --username "${MONGO_ROOT_USERNAME}"
      --password "${MONGO_ROOT_PASSWORD}"
      --authenticationDatabase admin
      --eval "try { rs.status(); print('replica set already initialized') } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
