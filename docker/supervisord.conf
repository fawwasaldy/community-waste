[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:php]
command=/usr/bin/php8.5 -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
